services:
  # Docker socket 的「只读小窗口」。只有它挂 socket，只放行三个 GET 端点，
  # 其它一律 403（详细说明见 docker-proxy.mjs 顶部）。
  # 有了它，fnStart 主容器被攻破的后果从「宿主机 root」降到「只能读容器列表」。
  docker-proxy:
    build: .
    image: fnstart:latest
    container_name: fnstart-docker-proxy
    restart: unless-stopped
    # 和主容器一样用 host 网络，这样能绑到 127.0.0.1:2375，
    # 局域网和公网都碰不到这个代理。
    network_mode: host
    command: ["node", "docker-proxy.mjs"]
    environment:
      PROXY_LISTEN: 127.0.0.1:2375
      DOCKER_SOCK_INNER: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # 镜像自带的健康检查探的是主应用的 /api/health，这个容器里没跑那个服务，
    # 继承下来会永远 unhealthy，所以关掉。
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "1"

  fnstart:
    build: .
    image: fnstart:latest
    container_name: fnstart
    restart: unless-stopped
    # 前置依赖：飞牛监控 fnMonitor —— 第三方开源应用（MIT，github.com/MisiteQ/fnmonitor），
    # 装在 /vol1/@appcenter/fnmonitor，监听 8777。
    # 它不是 Docker 应用，没法写进这份 compose 一起起来；
    # 没装也能用，只是右侧监控面板会提示离线。
    # 关键：必须用 host 网络。
    # 只有和宿主机共用网络命名空间，才能读到全部监听端口（/proc/net/tcp），
    # 从而发现「没做端口映射」的 host 网络容器，以及不是 Docker 安装的飞牛服务（5666 / 8777）。
    network_mode: host
    environment:
      PORT: 3721
      DATA_DIR: /data
      # 走 docker-proxy，不直接挂 socket。想退回旧行为就改成 /var/run/docker.sock
      # （并把下面那行 volumes 里的 socket 挂回来）。
      DOCKER_SOCK: http://127.0.0.1:2375
      # 探测超时（毫秒），NAS 上服务多可以调到 3000
      PROBE_TIMEOUT: 2500
      # 监控地址留空 = 自动用「访问导航页的主机名:8777」，
      # 用 https 或反代域名时再取消注释手动指定：
      # MONITOR_URL: http://192.168.1.10:8777/#/overview
      # MONITOR_PORT: 8777
      # 天气默认城市，页面上也能改
      # WEATHER_CITY: 北京
      # 访问令牌：纯内网可以留空；只要打算把端口映射到公网，就必须设一个，
      # 否则任何人都能改你的卡片、读监控数据、把 /fn/ 当成访问内网的跳板。
      # 不要直接写在这里 —— 这份文件要提交到 git。
      # 在旁边的 .env 里写 ACCESS_TOKEN=xxx（生成：./scripts/new-token.sh --write），
      # .env 已被 .gitignore 挡住，不会进仓库。
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      # 设了令牌后会自动禁止服务端抓内网图标（防 SSRF）；纯内网想强行关掉就设 0
      # BLOCK_PRIVATE_FETCH: 0
      #
      # 前面挂了反代（这里是雷池）就打开它，登录限速才会按「真实客户端 IP」算，
      # 而不是把所有人算成同一个 127.0.0.1。
      # 安全性依赖一条：只有直连方是本机地址 / TRUST_PROXY_CIDRS 里的地址时才采信转发头。
      # 别人从局域网直连过来伪造 X-Forwarded-For 没用，照样按他的 socket 地址计。
      TRUST_PROXY: "1"
      # 反代不在本机时才需要填，逗号分隔 CIDR，例如 172.18.0.0/16
      # TRUST_PROXY_CIDRS: "" 
    # 需要 CAP_SYS_PTRACE 才能读宿主机 /proc/<pid>/fd，把 host 网络容器的端口
    # 反查回容器名。不加也能跑，只是这类容器认不出来，卡片退回用网页标题命名。
    #
    # 其余能力一律丢掉：这套东西只做「读文件 + 读 proc/sys + 听端口」，
    # 不需要 NET_ADMIN / SYS_ADMIN / MKNOD / NET_RAW / SETUID 这些。
    # 但 DAC_OVERRIDE 和 DAC_READ_SEARCH 必须留着 —— /data 目录在宿主机用户名下、
    # 权限 755，容器里虽然是 root，缺了这两项就建不了同目录临时文件，
    # 而 store 的写入正是「临时文件 + rename」的原子写，会直接失败。
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
    # 进程不能再通过 setuid 之类的路子把权限拿回来
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data
      # 注意：这里**不挂** docker socket。列容器走上面的 docker-proxy，
      # 即使本容器被拿下，也拿不到 Docker 的写权限。
      # 只读挂载宿主机 procfs：用于反查 host 网络容器占用的端口。
      # 不挂也能用，只是 host 网络的容器认不出名字，卡片会退回用网页标题命名。
      - /proc:/host/proc:ro
      # 只读挂载宿主机 sysfs：监控面板的 CPU/主板/硬盘温度、风扇转速、
      # RAPL 功耗都从这里读。不挂的话温度、风扇、功耗会显示「无数据」，
      # CPU 使用率/内存/网络/磁盘依然正常（那些来自 /proc）。
      - /sys:/host/sys:ro
      # 其它存储空间（/vol2、/vol3…）不写死在这里 —— 每台机器有几个卷不一样，
      # 写死会让没有该卷的机器上凭空多出一个空目录。
      # install.sh 会探测宿主机实际存在的 /volN，自动生成
      # docker-compose.override.yml 把它们挂进来；手动部署的话按下面格式自己加：
      #   - /vol2:/host/vol2:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
